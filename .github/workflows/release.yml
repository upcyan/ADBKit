name: Release

# 打 v* 标签即自动构建并发布 Release APK；也可以在 Actions 页面手动触发。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 自带 Android SDK，但通常没有 compileSdk 37 需要的 platform/build-tools，
      # 这里尽力补齐；Gradle 若仍缺组件会自己下载（licenses 已接受）。
      - name: 准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK=$SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager=${SDKMGR:-未找到}"
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            yes 2>/dev/null | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0"; do
              "$SDKMGR" "$pkg" >/dev/null 2>&1 && echo "已确保: $pkg" || echo "跳过: $pkg"
            done
          fi
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true

      # 签名材料只从 Secrets 注入，不落仓库。需要配置：
      #   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，请先在仓库 Settings → Secrets 配置签名材料"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "签名配置已生成"

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 收集产物
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK"
          cp "$APK" ADBKit-release.apk
          ls -la ADBKit-release.apk

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ADBKit-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
